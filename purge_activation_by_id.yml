---
# Purge a specific list of Activation IDs
# Other activations and logs without an associated activation are outside scope.
- name: Purge a specific list of Activation IDs
  hosts: localhost
  gather_facts: false
  vars:
    aap_hostname: "https://example.com"
    aap_validate_certs: true
    retention_duration: "P30D" # Represents 30 days (ISO 8601 format)
    
    # Give list of 1 or more activation IDs below. This value can be
    # overridden in extra_vars in the Job Template.
    activation_ids: 
     - 1
     - 2

  tasks:
    - name: Queue activation log purge
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/logs/purge/"
        method: POST
        status_code: 202
        body_format: json
        body:
          retention_duration: "{{ retention_duration }}"
          activation_ids: {{ activation_ids }}
          audit_trail: true
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: purge_response
      # no_log: true

    - name: Report queued purge job
      ansible.builtin.debug:
        msg: "EDA activation log purge queued. Job ID: {{ purge_response.json.job_id }}"
