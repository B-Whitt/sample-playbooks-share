---
# Purge a specific Activation by ID
# Other activations and logs without an associated activation are outside scope.
- name: Purge a specific Activation by ID
  hosts: localhost
  gather_facts: false
  vars:
    aap_hostname: "https://example.com"
    aap_validate_certs: true
    retention_duration: "P30D"
    activation_id: 1  # Replace with an existing activation ID.

  tasks:
    - name: Queue activation log purge
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/logs/purge/"
        method: POST
        status_code: 202
        body_format: json
        body:
          retention_duration: "{{ retention_duration }}"
          activation_ids:
            - "{{ activation_id | int }}"
          audit_trail: true
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: purge_response
      no_log: true

    - name: Report queued purge job
      ansible.builtin.debug:
        msg: "EDA activation log purge queued. Job ID: {{ purge_response.json.job_id }}"
